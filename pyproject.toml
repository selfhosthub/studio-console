[project]
name = "studio-console"
description = "Studio operator management console"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "cryptography>=41.0",
]
keywords = ["studio", "selfhost", "operator", "console"]
authors = [{name = "Kawika Ohumukini"}]
license = "LicenseRef-Studio-Console-Use-License"
license-files = ["LICENSE", "LEGAL.md"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dynamic = ["version"]

[project.scripts]
studio-console = "studio_console:main"

[project.urls]
Homepage = "https://github.com/selfhosthub/studio-console"
Issues = "https://github.com/selfhosthub/studio-console/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
include = [
    "studio_console/",
    "docker-compose.yml",
    "nginx/",
    "templates/",
    "VERSION",
]

[tool.hatch.build.targets.sdist]
include = [
    "studio_console/",
    "docker-compose.yml",
    "nginx/",
    "templates/",
    "VERSION",
    "install.sh",
    "studio-console.py",
]
